<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LawSpeak Club | Who Owns It?</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172c44;background:#eef3f8}*{box-sizing:border-box}body{margin:0;padding:18px}.sheet{max-width:700px;margin:auto;background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #1936531c}.hero{background:#142c46;color:white;padding:27px 28px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;letter-spacing:.06em;color:#f4ca70;font-weight:700}.level{color:white;border:1px solid #ffffff77;border-radius:30px;padding:5px 10px}h1{font-size:clamp(29px,7vw,44px);margin:22px 0 4px;letter-spacing:.02em}.subtitle{font-size:18px;color:#d9e7f6}.motto{color:#f4ca70;margin-top:15px;font-size:14px}.content{padding:24px 28px 30px}h2{font-size:20px;margin:0 0 8px}.intro{color:#556b80;margin:0 0 20px}.item{padding:16px 0;border-bottom:1px solid #e3e9ef}.item label{display:block;font-weight:600;margin-bottom:10px;line-height:1.5}select{width:100%;padding:12px;border:1px solid #bccbd9;border-radius:10px;font-size:16px;color:#172c44;background:#fff}.feedback{font-size:14px;margin-top:7px;font-weight:600}.good{color:#197047}.bad{color:#ae3b37}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.count{color:#60758a}button{border:0;border-radius:11px;background:#142c46;color:white;font-weight:700;font-size:15px;padding:13px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.reset{background:#e7edf3;color:#172c44}.score{margin-top:17px;font-weight:700;font-size:20px}.foot{text-align:center;color:#6c8093;font-size:12px;margin-top:23px}@media(max-width:480px){body{padding:8px}.hero{padding:23px 20px}.content{padding:22px 20px}}
</style></head><body><main class="sheet"><header class="hero"><div class="top"><span>⚖️ LAWSPEAK CLUB</span><span class="level">🇬🇧 A2–B1</span></div><h1>WHO OWNS IT?</h1><div class="subtitle">Family, Money &amp; Law</div><div class="motto">Speak English. Explore Law.</div></header><section class="content"><h2>🧩 Match the words with their meanings!</h2><p class="intro">Choose the correct legal term for each definition. Then check your answers.</p><div id="questions"></div><div class="bottom"><span class="count" id="count">0 of 6 answered</span><div><button id="check" disabled>Check Answers</button> <button class="reset" id="reset">Try Again</button></div></div><div class="score" id="score" aria-live="polite"></div><div class="foot">⚖️ Think like a lawyer. Speak English! 🇬🇧</div></section></main><script>
const words=['Ownership','Consent','Property','Liability','Maintenance','Guardian'];
const items=[['Legal responsibility for something','Liability'],['Money paid to support someone','Maintenance'],['The legal right to own something','Ownership'],['A person legally responsible for a child','Guardian'],['Something that belongs to a person','Property'],['Permission or agreement','Consent']];
const root=document.getElementById('questions'),count=document.getElementById('count'),check=document.getElementById('check'),score=document.getElementById('score');
items.forEach(([definition],i)=>{const box=document.createElement('div');box.className='item';const label=document.createElement('label');label.htmlFor='q'+i;label.textContent=(i+1)+'. '+definition;const select=document.createElement('select');select.id='q'+i;select.innerHTML='<option value="">Choose a word</option>'+words.map(w=>'<option value="'+w+'">'+w+'</option>').join('');const feedback=document.createElement('div');feedback.className='feedback';feedback.id='f'+i;select.addEventListener('change',()=>{feedback.textContent='';feedback.className='feedback';score.textContent='';update()});box.append(label,select,feedback);root.append(box)});
function update(){let n=[...document.querySelectorAll('select')].filter(s=>s.value).length;count.textContent=n+' of 6 answered';check.disabled=n!==6}
check.addEventListener('click',()=>{let n=0;items.forEach(([,answer],i)=>{const ok=document.getElementById('q'+i).value===answer;if(ok)n++;const f=document.getElementById('f'+i);f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Correct!':'✗ Correct answer: '+answer});score.textContent='Your score: '+n+' / 6 '+(n===6?'🎉 Excellent!':'— Try again to improve your score!')});
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('select').forEach(s=>s.value='');document.querySelectorAll('.feedback').forEach(f=>{f.textContent='';f.className='feedback'});score.textContent='';update();scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
